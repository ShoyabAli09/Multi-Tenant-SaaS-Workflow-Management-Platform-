services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_web_api
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-class gthread --timeout 60 config.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-compose-production-grade-key-2026
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_ENGINE=postgresql
      - POSTGRES_DB=saas_workflow_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network

  db:
    image: postgres:16-alpine
    container_name: saas_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-docker-compose-production-grade-key-2026
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_ENGINE=postgresql
      - POSTGRES_DB=saas_workflow_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-docker-compose-production-grade-key-2026
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_ENGINE=postgresql
      - POSTGRES_DB=saas_workflow_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  saas_network:
    driver: bridge

